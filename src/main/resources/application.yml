server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ecommerce-order-platform

  datasource:
    url: ${DB_URL:jdbc:mysql://ecommerce-mysql:3306/intern?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:dk1306}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: "http://localhost:5173,http://127.0.0.1:5173"
        allowed-methods: "GET,OPTIONS"
        allowed-headers: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    root: INFO
    com.example.ecommerce: DEBUG
    org.hibernate.SQL: WARN
