name: Java CI

on:
  push:
    branches:
      - main
      - devops/docker

  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  BACKEND_IMAGE: ecommerce-backend
  FRONTEND_IMAGE: ecommerce-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Set up Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Make Maven Wrapper executable
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # 4. Run tests
      - name: Run tests
        run: ./mvnw test

      # 5. Build Spring Boot application
      - name: Build application
        run: ./mvnw clean package -DskipTests

      # 6. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 7. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 8. Build backend Docker image
      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            .

      # 9. Build frontend Docker image
      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./ecommerce-frontend

      # 10. Push backend image to ECR
      - name: Push backend image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      # 11. Push frontend image to ECR
      - name: Push frontend image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}